<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group | AcademicOS</title>

    <style>
        :root {
            --bg: #F4F6F9;
            --surface: #FFFFFF;
            --text: #14213D;
            --muted: #64748B;
            --border: #D9DFE8;
            --primary: #0E7C7B;
            --soft: #E5F4F3;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, Arial, sans-serif;
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        main {
            max-width: 950px;
            margin: auto;
            padding-bottom: 40px;
        }

        .back {
            display: inline-block;
            margin-bottom: 22px;
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
        }

        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 22px;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        h2 {
            margin: 0;
            font-size: 20px;
        }

        p {
            color: var(--muted);
            line-height: 1.6;
        }

        .group-id {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            background: var(--soft);
            color: var(--primary);
            font-size: 12px;
            font-weight: 700;
            overflow-wrap: anywhere;
        }

        .field {
            margin-top: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: 700;
        }

        input,
        textarea,
        select {
            display: block;
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: white;
            color: var(--text);
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: 2px solid var(--soft);
            border-color: var(--primary);
        }

        .primary-button {
            margin-top: 18px;
            padding: 12px 18px;
            border: 0;
            border-radius: 9px;
            background: var(--primary);
            color: white;
            font-weight: 700;
        }

        .primary-button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .task-list {
            display: grid;
            gap: 12px;
            margin-top: 20px;
        }

        .task-card {
            padding: 16px;
            border: 1px solid var(--border);
            border-radius: 11px;
            background: white;
        }

        .task-card h3 {
            margin: 0 0 7px;
            font-size: 16px;
            overflow-wrap: anywhere;
        }

        .task-card p {
            margin: 5px 0;
            font-size: 13px;
            overflow-wrap: anywhere;
        }

        .task-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .badge {
            padding: 5px 9px;
            border-radius: 20px;
            background: var(--soft);
            color: var(--primary);
            font-size: 11px;
            font-weight: 700;
        }

        .message {
            padding: 14px 0;
            color: var(--muted);
            font-size: 14px;
        }

        #notice {
            min-height: 18px;
            font-size: 13px;
        }

        .error {
            color: #B42318;
        }

        .success {
            color: #167347;
        }

        @media (max-width: 600px) {
            body {
                padding: 16px;
            }

            .panel {
                padding: 17px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>
    <main>
        <a class="back" href="../index.html">← Back to AcademicOS</a>

        <section class="panel">
            <h1 id="groupName">Loading group...</h1>
            <p id="groupDescription">Please wait while group details load.</p>
            <span class="group-id" id="groupIdLabel"></span>
            <p id="roleMessage"></p>
        </section>

        <section class="panel" id="createTaskPanel" hidden>
            <h2>Create an assignment</h2>
            <p>Assign academic work to members of this group.</p>

            <form id="taskForm">
                <div class="field">
                    <label for="taskTitle">Task title *</label>
                    <input id="taskTitle" maxlength="200" required placeholder="e.g. Complete HTML assignment">
                </div>

                <div class="field">
                    <label for="taskDescription">Instructions</label>
                    <textarea id="taskDescription" maxlength="2000"
                        placeholder="Explain what students need to do"></textarea>
                </div>

                <div class="field">
                    <label for="taskDueDate">Deadline (optional)</label>
                    <input id="taskDueDate" type="datetime-local">
                </div>

                <p id="notice" role="status" aria-live="polite"></p>

                <button class="primary-button" id="createTaskButton" type="submit">
                    Create assignment
                </button>
            </form>
        </section>

        <section class="panel">
            <h2>Group assignments</h2>
            <p>Tasks assigned to this group.</p>
            <div id="taskList" class="task-list">
                <div class="message">Loading assignments...</div>
            </div>
        </section>
    </main>

    <script type="module">
        import { auth, db } from "../core/firebase-config.js";

        import {
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

        import {
            collection,
            doc,
            getDoc,
            getDocs,
            query,
            orderBy,
            limit,
            where,
            writeBatch,
            serverTimestamp,
            Timestamp
        } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

        const $ = id => document.getElementById(id);

        const params = new URLSearchParams(window.location.search);
        const groupId = params.get("groupId");

        const groupName = $("groupName");
        const groupDescription = $("groupDescription");
        const groupIdLabel = $("groupIdLabel");
        const roleMessage = $("roleMessage");
        const createTaskPanel = $("createTaskPanel");
        const taskForm = $("taskForm");
        const taskTitle = $("taskTitle");
        const taskDescription = $("taskDescription");
        const taskDueDate = $("taskDueDate");
        const taskList = $("taskList");
        const notice = $("notice");
        const createTaskButton = $("createTaskButton");

        let currentUser = null;
        let currentRole = null;

        function showNotice(message, type = "") {
            notice.textContent = message;
            notice.className = type;
        }

        function showTaskMessage(message) {
            taskList.replaceChildren();
            const element = document.createElement("div");
            element.className = "message";
            element.textContent = message;
            taskList.appendChild(element);
        }

        function formatDate(value) {
            if (!value) return "No deadline";

            const date = typeof value.toDate === "function"
                ? value.toDate()
                : new Date(value);

            return Number.isNaN(date.getTime())
                ? "No deadline"
                : date.toLocaleString();
        }

        async function loadGroup(user) {
            if (!groupId) {
                groupName.textContent = "Group not selected";
                groupDescription.textContent =
                    "Open a group from the Home page.";
                createTaskPanel.hidden = true;
                showTaskMessage("A group ID is required.");
                return;
            }

            try {
                const groupRef = doc(db, "groups", groupId);
                const groupSnapshot = await getDoc(groupRef);

                if (!groupSnapshot.exists()) {
                    groupName.textContent = "Group not found";
                    groupDescription.textContent =
                        "This group may have been deleted or the link is invalid.";
                    createTaskPanel.hidden = true;
                    showTaskMessage("Group unavailable.");
                    return;
                }

                const data = groupSnapshot.data();

                // Verify membership before displaying group information.
                const memberRef = doc(
                    db, "groups", groupId, "members", user.uid
                );

                const memberSnapshot = await getDoc(memberRef);

                if (!memberSnapshot.exists()) {
                    groupName.textContent = "Access denied";
                    groupDescription.textContent =
                        "You are not a member of this group.";
                    createTaskPanel.hidden = true;
                    showTaskMessage("You do not have access to this group.");
                    return;
                }

                currentRole = memberSnapshot.data().role;

                groupName.textContent = data.name || "Untitled group";
                groupDescription.textContent =
                    data.description || "No description added.";
                groupIdLabel.textContent = `Group ID: ${groupId}`;
                roleMessage.textContent = `Your role: ${currentRole}`;

                // Only admins and teachers can create assignments.
                createTaskPanel.hidden =
                    !["admin", "teacher"].includes(currentRole);

                await loadTasks();
            } catch (error) {
                console.error("Group loading error:", error);

                groupName.textContent = "Could not load group";
                groupDescription.textContent =
                    "Check your Firestore security rules.";
                createTaskPanel.hidden = true;
                showTaskMessage("Unable to load group details.");
            }
        }

        async function loadTasks() {
            showTaskMessage("Loading assignments...");

            try {
                const tasksRef = collection(db, "groups", groupId, "tasks");

                const tasksQuery = query(
                    tasksRef,
                    orderBy("createdAt", "desc"),
                    limit(50)
                );

                const snapshot = await getDocs(tasksQuery);

                // If the collection is empty, show a helpful message.
                if (snapshot.empty) {
                    showTaskMessage("No assignments yet.");
                    return;
                }

                taskList.replaceChildren();

                for (const taskDoc of snapshot.docs) {
                    const task = taskDoc.data();

                    const card = document.createElement("article");
                    card.className = "task-card";

                    const title = document.createElement("h3");
                    title.textContent = task.title || "Untitled assignment";

                    const description = document.createElement("p");
                    description.textContent =
                        task.description || "No additional instructions.";

                    const deadline = document.createElement("p");
                    deadline.textContent = `Deadline: ${formatDate(task.dueDate)}`;

                    const meta = document.createElement("div");
                    meta.className = "task-meta";

                    const status = document.createElement("span");
                    status.className = "badge";
                    status.textContent = task.status || "assigned";

                    meta.appendChild(status);
                    card.append(title, description, deadline, meta);
                    taskList.appendChild(card);
                }
            } catch (error) {
                console.error("Assignment loading error:", error);
                showTaskMessage(
                    "Unable to load assignments. Check Firestore rules and indexes."
                );
            }
        }

        taskForm.addEventListener("submit", async event => {
            event.preventDefault();

            if (!currentUser ||
                !["admin", "teacher"].includes(currentRole)) {
                showNotice("You do not have permission to create assignments.", "error");
                return;
            }

            const title = taskTitle.value.trim();
            const description = taskDescription.value.trim();
            const deadlineValue = taskDueDate.value;

            if (!title) {
                showNotice("Enter an assignment title.", "error");
                return;
            }

            let dueDate = null;

            if (deadlineValue) {
                const parsedDate = new Date(deadlineValue);

                if (Number.isNaN(parsedDate.getTime())) {
                    showNotice("Enter a valid deadline.", "error");
                    return;
                }

                if (parsedDate.getTime() <= Date.now()) {
                    showNotice("Choose a future deadline.", "error");
                    return;
                }

                dueDate = Timestamp.fromDate(parsedDate);
            }

            createTaskButton.disabled = true;
            createTaskButton.textContent = "Creating...";
            showNotice("");

            try {
                const taskRef = doc(
                    collection(db, "groups", groupId, "tasks")
                );

                await writeBatch(db)
                    .set(taskRef, {
                        title,
                        description,
                        createdBy: currentUser.uid,
                        createdAt: serverTimestamp(),
                        dueDate,
                        status: "assigned"
                    })
                    .commit();

                taskForm.reset();
                showNotice("Assignment created successfully!", "success");
                await loadTasks();
            } catch (error) {
                console.error("Assignment creation error:", error);

                showNotice(
                    error.code === "permission-denied"
                        ? "Permission denied. Check your group task rules."
                        : "Could not create the assignment. Please try again.",
                    "error"
                );
            } finally {
                createTaskButton.disabled = false;
                createTaskButton.textContent = "Create assignment";
            }
        });

        onAuthStateChanged(auth, async user => {
            if (!user) {
                window.location.replace("./account.html");
                return;
            }

            currentUser = user;
            await loadGroup(user);
        });
    </script>
</body>

</html>
