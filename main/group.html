<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group | AcademicOS</title>
    <link rel="stylesheet" href="../css/common.css">
    <style>
        :root {
            --bg: #F4F6F9;
            --surface: #FFFFFF;
            --text: #14213D;
            --muted: #64748B;
            --border: #D9DFE8;
            --primary: #0E7C7B;
            --soft: #E5F4F3;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, Arial, sans-serif;
        }

        main {
            max-width: 950px;
            margin: auto;
            padding-bottom: 40px;
        }

        .back {
            display: inline-block;
            margin-bottom: 22px;
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
        }

        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 22px;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        h2 {
            margin: 0;
            font-size: 20px;
        }

        p {
            color: var(--muted);
            line-height: 1.6;
        }

        .group-id {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            background: var(--soft);
            color: var(--primary);
            font-size: 12px;
            font-weight: 700;
        }

        .field {
            margin-top: 16px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: 700;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 9px;
            font: inherit;
        }

        textarea {
            min-height: 80px;
            resize: vertical;
        }

        .primary-button {
            margin-top: 16px;
            padding: 12px 18px;
            border: 0;
            border-radius: 9px;
            background: var(--primary);
            color: white;
            font-weight: 700;
            cursor: pointer;
        }

        .task-list {
            display: grid;
            gap: 14px;
            margin-top: 16px;
        }

        .task-card {
            border: 1px solid var(--border);
            border-radius: 11px;
            padding: 16px;
            background: white;
        }

        .task-card h3 {
            margin: 0 0 8px;
            font-size: 16px;
        }

        .row-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .chip {
            padding: 6px 10px;
            border-radius: 20px;
            background: var(--soft);
            color: var(--primary);
            font-size: 11px;
            font-weight: 700;
        }

        button.secondary {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-size: 13px;
        }

        .message {
            color: var(--muted);
            font-size: 14px;
            padding: 12px 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th,
        td {
            border-bottom: 1px solid var(--border);
            padding: 10px;
            text-align: left;
        }

        .review-box {
            margin-top: 10px;
            padding: 10px;
            border-radius: 8px;
            background: #F8FAFC;
            font-size: 13px;
        }

        .error {
            color: #B42318;
        }

        .success {
            color: #167347;
        }
    </style>
</head>

<body>
    <main>
        <a class="back" href="../index.html">← Back to AcademicOS</a>

        <section class="panel">
            <h1 id="groupName">Loading group...</h1>
            <p id="groupDescription"></p>
            <span class="group-id" id="groupIdLabel"></span>
            <p id="roleMessage"></p>
        </section>

        <section class="panel" id="createTaskPanel" hidden>
            <h2>Create assignment</h2>
            <form id="taskForm">
                <div class="field">
                    <label for="taskTitle">Title *</label>
                    <input id="taskTitle" maxlength="200" required>
                </div>
                <div class="field">
                    <label for="taskDescription">Instructions</label>
                    <textarea id="taskDescription" maxlength="2000"></textarea>
                </div>
                <div class="field">
                    <label for="taskDueDate">Deadline</label>
                    <input id="taskDueDate" type="datetime-local">
                </div>
                <p id="notice" role="status"></p>
                <button class="primary-button" id="createTaskButton" type="submit">Create assignment</button>
            </form>
        </section>

        <section class="panel">
            <h2>Assignments</h2>
            <div id="taskList" class="task-list">
                <div class="message">Loading...</div>
            </div>
        </section>

        <section class="panel" id="staffPanel" hidden>
            <h2>Student progress overview</h2>
            <div id="staffProgress"></div>
        </section>
    </main>

    <script type="module">
        import { auth, db } from "../core/firebase-config.js";
        import { onAuthStateChanged } from
            "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
        import {
            collection,
            doc,
            getDoc,
            getDocs,
            updateDoc,
            query,
            orderBy,
            limit,
            writeBatch,
            serverTimestamp,
            Timestamp
        } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

        import { getGroupMembership } from "../engine/groupEngine.js";
        import {
            canManageAssignments,
            roleLabel,
            formatDateTime
        } from "../engine/dataEngine.js";
        import {
            getTaskProgress,
            setTaskProgress,
            getSubmission,
            submitWork,
            reviewSubmission,
            loadMemberProgressMatrix
        } from "../engine/progressEngine.js";
        import { showToast } from "../engine/uiEngine.js";

        const params = new URLSearchParams(window.location.search);
        const groupId = params.get("groupId");

        const $ = id => document.getElementById(id);
        let currentUser = null;
        let currentRole = null;
        let cachedTasks = [];
        let cachedStudents = [];
        const memberNames = new Map();

        function isStaff() {
            return canManageAssignments(currentRole);
        }

        async function loadGroupMeta(groupSnap) {
            $("groupName").textContent = groupSnap.data().name || "Untitled group";
            $("groupDescription").textContent =
                groupSnap.data().description || "No description.";
            $("groupIdLabel").textContent = `Group ID: ${groupId}`;
            $("roleMessage").textContent = `Your role: ${roleLabel(currentRole)}`;
            $("createTaskPanel").hidden = !isStaff();
            $("staffPanel").hidden = !isStaff();
        }

        async function loadMembers() {
            const snap = await getDocs(collection(db, "groups", groupId, "members"));
            const members = snap.docs.map(item => ({ uid: item.id, ...item.data() }));

            memberNames.clear();
            for (const member of members) {
                if (member.displayName) memberNames.set(member.uid, member.displayName);
            }

            cachedStudents = members.filter(member => member.role === "student");
        }

        // Names come from the members documents (users/{uid} is private to each user).
        function memberName(uid) {
            return memberNames.get(uid) || `Student ${uid.slice(0, 6)}`;
        }

        // Older members were saved without a name; let them add it for themselves.
        async function backfillOwnName(membership) {
            if (membership.displayName) return;
            const name = (currentUser.displayName ||
                (currentUser.email || "").split("@")[0] || "").trim().slice(0, 60);
            if (!name) return;
            try {
                await updateDoc(
                    doc(db, "groups", groupId, "members", currentUser.uid),
                    { displayName: name }
                );
            } catch (error) {
                console.warn("Could not save display name:", error);
            }
        }

        async function renderStaffTable() {
            const container = $("staffProgress");
            container.replaceChildren();

            if (!cachedTasks.length) {
                container.innerHTML = '<p class="message">No assignments yet.</p>';
                return;
            }

            const matrix = await loadMemberProgressMatrix(
                groupId,
                cachedTasks.map(task => task.id),
                cachedStudents.map(student => student.uid)
            );

            const table = document.createElement("table");
            const head = document.createElement("tr");
            head.innerHTML = "<th>Assignment</th>";
            for (const student of cachedStudents) {
                const th = document.createElement("th");
                th.textContent = memberName(student.uid);
                head.appendChild(th);
            }
            table.appendChild(document.createElement("thead")).appendChild(head);

            const body = document.createElement("tbody");
            for (const task of cachedTasks) {
                const row = document.createElement("tr");
                const title = document.createElement("td");
                title.textContent = task.title;
                row.appendChild(title);

                const rowMap = matrix.get(task.id) || new Map();
                for (const student of cachedStudents) {
                    const cell = document.createElement("td");
                    cell.textContent = rowMap.get(student.uid) || "pending";
                    row.appendChild(cell);
                }
                body.appendChild(row);
            }
            table.appendChild(body);
            container.appendChild(table);
        }

        async function buildTaskCard(task) {
            const card = document.createElement("article");
            card.className = "task-card";

            const [progress, submission] = await Promise.all([
                getTaskProgress(groupId, task.id, currentUser.uid),
                getSubmission(groupId, task.id, currentUser.uid)
            ]);
            const progressStatus = progress?.status || "pending";

            const title = document.createElement("h3");
            title.textContent = task.title || "Untitled";

            const desc = document.createElement("p");
            desc.textContent = task.description || "No instructions.";

            const due = document.createElement("p");
            due.textContent = `Deadline: ${formatDateTime(task.dueDate)}`;

            const chip = document.createElement("span");
            chip.className = "chip";
            chip.textContent = `Progress: ${progressStatus}`;

            const actions = document.createElement("div");
            actions.className = "row-actions";

            const progressSelect = document.createElement("select");
            for (const status of ["pending", "in_progress", "completed"]) {
                const option = document.createElement("option");
                option.value = status;
                option.textContent = status.replace("_", " ");
                option.selected = progressStatus === status;
                progressSelect.appendChild(option);
            }

            const saveProgressBtn = document.createElement("button");
            saveProgressBtn.type = "button";
            saveProgressBtn.className = "secondary";
            saveProgressBtn.textContent = "Save progress";
            saveProgressBtn.addEventListener("click", async () => {
                try {
                    await setTaskProgress(
                        groupId, task.id, currentUser.uid, progressSelect.value
                    );
                    showToast("Progress updated.", "success");
                    await refreshTasks();
                } catch (error) {
                    console.error(error);
                    showToast("Could not update progress.", "error");
                }
            });

            actions.append(progressSelect, saveProgressBtn);

            // Header first, so the title is not pushed below the submission box.
            card.append(title, desc, due, chip, actions);

            if (currentRole === "student") {
                const submitArea = document.createElement("textarea");
                submitArea.placeholder = "Write your submission here...";
                submitArea.value = submission?.content || "";

                const submitBtn = document.createElement("button");
                submitBtn.type = "button";
                submitBtn.className = "secondary";
                submitBtn.textContent = "Submit work";
                submitBtn.addEventListener("click", async () => {
                    try {
                        await submitWork(
                            groupId, task.id, currentUser.uid, submitArea.value
                        );
                        showToast("Submission saved.", "success");
                        await refreshTasks();
                    } catch (error) {
                        console.error(error);
                        showToast("Submission failed.", "error");
                    }
                });

                card.append(submitArea, submitBtn);

                if (submission?.feedback) {
                    const feedback = document.createElement("div");
                    feedback.className = "review-box";
                    feedback.textContent =
                        `Review (${submission.reviewStatus || "pending"}): ${submission.feedback}`;
                    card.appendChild(feedback);
                }
            }

            if (isStaff()) {
                const submissions = await Promise.all(
                    cachedStudents.map(student =>
                        getSubmission(groupId, task.id, student.uid))
                );

                for (const [index, student] of cachedStudents.entries()) {
                    const sub = submissions[index];
                    if (!sub?.content) continue;

                    const block = document.createElement("div");
                    block.className = "review-box";

                    // textContent, never innerHTML: submissions are written by students.
                    const who = document.createElement("strong");
                    who.textContent = memberName(student.uid);
                    const text = document.createElement("div");
                    text.style.whiteSpace = "pre-wrap";
                    text.textContent = sub.content;
                    block.append(who, text);

                    const reviewSelect = document.createElement("select");
                    reviewSelect.innerHTML =
                        '<option value="accepted">accepted</option><option value="needs_revision">needs revision</option>';

                    const feedbackInput = document.createElement("input");
                    feedbackInput.placeholder = "Feedback for student";
                    feedbackInput.value = sub.feedback || "";

                    const reviewBtn = document.createElement("button");
                    reviewBtn.type = "button";
                    reviewBtn.className = "secondary";
                    reviewBtn.textContent = "Save review";
                    reviewBtn.addEventListener("click", async () => {
                        try {
                            await reviewSubmission(
                                groupId,
                                task.id,
                                student.uid,
                                currentUser.uid,
                                reviewSelect.value,
                                feedbackInput.value
                            );
                            showToast("Review saved.", "success");
                        } catch (error) {
                            console.error(error);
                            showToast("Review failed.", "error");
                        }
                    });

                    block.append(reviewSelect, feedbackInput, reviewBtn);
                    card.appendChild(block);
                }
            }

            return card;
        }

        async function refreshTasks() {
            const list = $("taskList");
            list.replaceChildren();

            if (!cachedTasks.length) {
                list.innerHTML = '<div class="message">No assignments yet.</div>';
                return;
            }

            const cards = await Promise.all(cachedTasks.map(buildTaskCard));
            list.append(...cards);

            if (isStaff()) await renderStaffTable();
        }

        async function loadTasks() {
            const tasksQuery = query(
                collection(db, "groups", groupId, "tasks"),
                orderBy("createdAt", "desc"),
                limit(50)
            );
            const snapshot = await getDocs(tasksQuery);
            cachedTasks = snapshot.docs.map(item => ({
                id: item.id,
                ...item.data()
            }));
            await refreshTasks();
        }

        $("taskForm").addEventListener("submit", async event => {
            event.preventDefault();
            if (!isStaff()) {
                showToast("Only teachers/admins can create assignments.", "error");
                return;
            }

            const title = $("taskTitle").value.trim();
            if (!title) return;

            let dueDate = null;
            if ($("taskDueDate").value) {
                dueDate = Timestamp.fromDate(new Date($("taskDueDate").value));
            }

            $("createTaskButton").disabled = true;
            try {
                const taskRef = doc(collection(db, "groups", groupId, "tasks"));
                await writeBatch(db).set(taskRef, {
                    title,
                    description: $("taskDescription").value.trim(),
                    createdBy: currentUser.uid,
                    createdAt: serverTimestamp(),
                    dueDate,
                    status: "assigned"
                }).commit();

                $("taskForm").reset();
                showToast("Assignment created.", "success");
                await loadTasks();
            } catch (error) {
                console.error(error);
                showToast("Could not create assignment.", "error");
            } finally {
                $("createTaskButton").disabled = false;
            }
        });

        onAuthStateChanged(auth, async user => {
            if (!user) {
                window.location.replace("./account.html");
                return;
            }

            currentUser = user;

            if (!groupId) {
                $("groupName").textContent = "Missing group ID";
                return;
            }

            try {
                const groupSnap = await getDoc(doc(db, "groups", groupId));
                if (!groupSnap.exists()) {
                    $("groupName").textContent = "Group not found";
                    return;
                }

                const membership = await getGroupMembership(groupId, user.uid);
                if (!membership) {
                    $("groupName").textContent = "Access denied";
                    $("groupDescription").textContent = "You are not a member.";
                    return;
                }

                currentRole = membership.role;
                backfillOwnName(membership);
                await loadGroupMeta(groupSnap);
                await loadMembers();
                await loadTasks();
            } catch (error) {
                console.error("Group page error:", error);
                showToast("Failed to load group.", "error");
            }
        });
    </script>
</body>

</html>
