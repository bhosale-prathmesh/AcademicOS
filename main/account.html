<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F4F6F9">
    <title>AcademicOS | Account</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --background: #F4F6F9;
            --surface: #FFFFFF;
            --text: #14213D;
            --muted: #5B6577;
            --border: #D9DFE8;
            --primary: #0E7C7B;
            --primary-strong: #0A5F5E;
            --soft: #E8F5F4;
            --danger: #C62828;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            padding: 28px 16px;
            display: grid;
            place-items: center;
            background: var(--background);
            color: var(--text);
            font-family: Inter, Arial, sans-serif;
        }

        button,
        input {
            font: inherit;
        }

        .page {
            width: 100%;
            max-width: 460px;
            margin: auto;
        }

        .brand {
            text-align: center;
            margin-bottom: 25px;
        }

        .brand h1 {
            font-size: clamp(27px, 5vw, 32px);
            font-weight: 800;
            letter-spacing: -1.2px;
        }

        .brand h1 span {
            color: var(--primary);
        }

        .brand p {
            color: var(--muted);
            font-size: 13px;
            margin-top: 8px;
            line-height: 1.6;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: clamp(20px, 5vw, 30px);
            box-shadow: 0 12px 36px rgba(20, 33, 61, 0.07);
        }

        .card h2 {
            font-size: clamp(21px, 4vw, 25px);
            letter-spacing: -0.5px;
        }

        .description {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.65;
            margin-top: 9px;
            margin-bottom: 23px;
        }

        .toggle {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
            padding: 5px;
            border-radius: 12px;
            background: #F0F3F7;
            margin-bottom: 24px;
        }

        .toggle button {
            border: 0;
            border-radius: 9px;
            padding: 12px 8px;
            background: transparent;
            color: var(--muted);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .toggle button.active {
            color: var(--primary-strong);
            background: #FFFFFF;
            box-shadow: 0 1px 5px rgba(20, 33, 61, 0.1);
        }

        .field {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            min-width: 0;
            height: 46px;
            padding: 0 13px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: #FFFFFF;
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input::placeholder {
            color: #98A2B3;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(14, 124, 123, 0.12);
        }

        .google-button {
            width: 100%;
            min-height: 49px;
            padding: 12px 14px;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 11px;
            border: 1px solid var(--border);
            border-radius: 11px;
            background: #FFFFFF;
            color: var(--text);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .google-button:hover:not(:disabled) {
            border-color: #AEBBCB;
            background: #F8FAFC;
        }

        .google-button:focus-visible,
        .toggle button:focus-visible {
            outline: 3px solid rgba(14, 124, 123, 0.3);
            outline-offset: 3px;
        }

        .google-button:disabled {
            opacity: 0.65;
            cursor: wait;
        }

        .google-icon {
            width: 19px;
            height: 19px;
            flex-shrink: 0;
        }

        .status {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            font-size: 12px;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .status.show {
            display: block;
        }

        .status.error {
            color: var(--danger);
            background: #FEF2F2;
        }

        .status.info {
            color: var(--primary-strong);
            background: var(--soft);
        }

        .privacy {
            text-align: center;
            margin-top: 19px;
            color: var(--muted);
            font-size: 11px;
            line-height: 1.7;
        }

        [hidden] {
            display: none !important;
        }

        @media (max-width: 480px) {
            body {
                padding: 22px 13px;
                align-items: start;
            }

            .page {
                margin: auto 0;
            }

            .brand {
                margin-bottom: 19px;
            }

            .card {
                border-radius: 17px;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                transition: none !important;
            }
        }
    </style>
</head>

<body>
    <main class="page">
        <header class="brand">
            <h1>Academic<span>OS</span></h1>
            <p>All your academic tasks. One clear priority.</p>
        </header>

        <section class="card">
            <h2 id="heading">Create your account</h2>
            <p class="description" id="description">
                Set up your profile to get started with AcademicOS.
            </p>

            <div class="toggle" role="group" aria-label="Account mode">
                <button type="button" id="signupTab" class="active" aria-pressed="true">Create Account</button>
                <button type="button" id="loginTab" aria-pressed="false">Log In</button>
            </div>

            <form id="accountForm">
                <div id="profileFields">
                    <div class="field">
                        <label for="name">Full name</label>
                        <input id="name" type="text" autocomplete="name" maxlength="100"
                            placeholder="Enter your full name" required>
                    </div>

                    <div class="field">
                        <label for="age">Age</label>
                        <input id="age" type="number" min="13" max="100" inputmode="numeric"
                            placeholder="Enter your age" required>
                    </div>

                    <div class="field">
                        <label for="college">College name</label>
                        <input id="college" type="text" maxlength="150" placeholder="Enter your college name" required>
                    </div>

                    <div class="field">
                        <label for="year">Academic year</label>
                        <input id="year" type="text" maxlength="50" placeholder="e.g. First Year" required>
                    </div>

                    <div class="field">
                        <label for="branch">Branch</label>
                        <input id="branch" type="text" maxlength="100" placeholder="e.g. Computer Engineering" required>
                    </div>
                </div>

                <button type="submit" class="google-button" id="googleButton">
                    <svg class="google-icon" viewBox="0 0 48 48" aria-hidden="true">
                        <path fill="#EA4335"
                            d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"
                            transform="translate(0 4)" />
                        <path fill="#4285F4"
                            d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.72 7.18l7.64 5.93c4.46-4.12 7.12-10.2 7.12-17.58z" />
                        <path fill="#FBBC05" d="M10.53 28.59a14.4 14.4 0 0 1 0-9.18l-7.98-6.2a24 24 0 0 0 0 21.58z" />
                        <path fill="#34A853"
                            d="M24 48c6.48 0 11.93-2.13 15.9-5.87l-7.64-5.93c-2.12 1.42-4.83 2.27-8.26 2.27-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
                    </svg>
                    <span id="buttonText">Continue with Google</span>
                </button>
            </form>

            <div class="status" id="status" role="status" aria-live="polite"></div>
        </section>

        <p class="privacy">
            Secure sign-in with Google. Your account is identified by your
            Firebase UID.
        </p>
    </main>

    <script type="module">
        import { auth, db } from "../core/firebase-config.js";

        import {
            GoogleAuthProvider,
            signInWithPopup
        } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

        import {
            doc,
            getDoc,
            setDoc,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

        const form = document.getElementById("accountForm");
        const signupTab = document.getElementById("signupTab");
        const loginTab = document.getElementById("loginTab");
        const profileFields = document.getElementById("profileFields");
        const heading = document.getElementById("heading");
        const description = document.getElementById("description");
        const googleButton = document.getElementById("googleButton");
        const buttonText = document.getElementById("buttonText");
        const statusBox = document.getElementById("status");

        const provider = new GoogleAuthProvider();
        let mode = "signup";
        let busy = false;

        function showStatus(message, type = "info") {
            statusBox.textContent = message;
            statusBox.className = `status show ${type}`;
        }

        function setMode(nextMode) {
            if (busy) return;

            mode = nextMode;
            const isSignup = mode === "signup";

            signupTab.classList.toggle("active", isSignup);
            loginTab.classList.toggle("active", !isSignup);

            signupTab.setAttribute("aria-pressed", String(isSignup));
            loginTab.setAttribute("aria-pressed", String(!isSignup));

            heading.textContent = isSignup
                ? "Create your account"
                : "Welcome back";

            description.textContent = isSignup
                ? "Set up your profile to get started with AcademicOS."
                : "Sign in with the Google account linked to your AcademicOS profile.";

            profileFields.hidden = !isSignup;

            profileFields.querySelectorAll("input").forEach((input) => {
                input.required = isSignup;
            });

            buttonText.textContent = isSignup
                ? "Continue with Google"
                : "Sign in with Google";

            statusBox.className = "status";
            statusBox.textContent = "";
        }

        signupTab.addEventListener("click", () => setMode("signup"));
        loginTab.addEventListener("click", () => setMode("login"));

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            if (busy) return;

            if (mode === "signup" && !form.reportValidity()) return;

            const profile = {
                name: document.getElementById("name").value.trim(),
                age: Number(document.getElementById("age").value),
                collegeName: document.getElementById("college").value.trim(),
                year: document.getElementById("year").value.trim(),
                branch: document.getElementById("branch").value.trim()
            };

            if (mode === "signup") {
                if (
                    !profile.name ||
                    !profile.collegeName ||
                    !profile.year ||
                    !profile.branch ||
                    !Number.isInteger(profile.age) ||
                    profile.age < 13 ||
                    profile.age > 100
                ) {
                    showStatus("Please complete all fields with valid information.", "error");
                    return;
                }
            }

            busy = true;
            googleButton.disabled = true;
            buttonText.textContent = "Connecting to Google...";
            showStatus("Please complete Google sign-in.");

            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;

                if (!user.email) {
                    throw new Error("Google did not provide an email address.");
                }

                const profileRef = doc(db, "users", user.uid);
                const profileSnapshot = await getDoc(profileRef);

                if (mode === "login") {
                    if (!profileSnapshot.exists()) {
                        // This Google identity authenticated, but has no AcademicOS profile.
                        await auth.signOut();
                        showStatus(
                            "No AcademicOS profile was found for this Google account. Choose Create Account to register.",
                            "error"
                        );
                        return;
                    }

                    showStatus("Login successful. Opening AcademicOS...");
                    window.location.replace("../index.html");
                    return;
                }

                if (profileSnapshot.exists()) {
                    showStatus(
                        "An AcademicOS profile already exists for this Google account. Switch to Log In.",
                        "error"
                    );
                    await auth.signOut();
                    return;
                }

                await setDoc(profileRef, {
                    uid: user.uid,
                    email: user.email,
                    name: profile.name,
                    age: profile.age,
                    collegeName: profile.collegeName,
                    year: profile.year,
                    branch: profile.branch,
                    createdAt: serverTimestamp()
                });

                showStatus("Account created! Opening AcademicOS...");
                window.location.replace("../index.html");

            } catch (error) {
                console.error("AcademicOS authentication error:", error);

                if (error.code === "auth/popup-closed-by-user") {
                    showStatus("Sign-in was cancelled. You can try again.", "error");
                } else if (error.code === "auth/popup-blocked") {
                    showStatus("Popup blocked. Allow popups for this site and retry.", "error");
                } else if (error.code === "auth/unauthorized-domain") {
                    showStatus(
                        "This website domain is not authorized in Firebase Authentication settings.",
                        "error"
                    );
                } else if (
                    error.code === "permission-denied" ||
                    error.code === "firestore/permission-denied"
                ) {
                    showStatus("Firestore denied access. Check your Firestore security rules.", "error");
                } else {
                    showStatus(error.message || "Something went wrong. Please try again.", "error");
                }

            } finally {
                busy = false;
                googleButton.disabled = false;
                buttonText.textContent = mode === "signup"
                    ? "Continue with Google"
                    : "Sign in with Google";
            }
        });
    </script>
</body>

</html>
